<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク一覧 - 案 A: 行クリック遷移</title>
  <link rel="stylesheet" href="../../../../../../assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">my-plugins mock</div>
  </header>
  <main class="main">
    <p class="breadcrumb"><a href="../">案リスト</a> &gt; <span>案 A</span></p>
    <div class="page-header">
      <h1>タスク一覧</h1>
      <div class="actions">
        <button class="primary" id="new-btn">新規追加</button>
      </div>
    </div>
    <p class="hint">行をクリックするとタスク編集画面へ遷移する。列構成は既存のまま変更しない。</p>
    <table class="data-table" id="task-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>タイトル</th>
          <th>状態</th>
          <th>期限</th>
          <th>担当</th>
        </tr>
      </thead>
      <tbody>
        <tr data-id="T-101"><td>T-101</td><td>請求書テンプレートの差し替え</td><td><span class="badge warn">対応中</span></td><td>2026-08-14</td><td>山田 太郎</td></tr>
        <tr data-id="T-102"><td>T-102</td><td>月次レポートの集計仕様を確認</td><td><span class="badge ok">完了</span></td><td>2026-08-07</td><td>佐藤 花子</td></tr>
        <tr data-id="T-103"><td>T-103</td><td>問い合わせ導線の文言を見直す</td><td><span class="badge danger">未着手</span></td><td>2026-08-21</td><td>鈴木 一郎</td></tr>
      </tbody>
    </table>
    <div class="pager">
      <button class="ghost">前へ</button>
      <span>1 / 4</span>
      <button class="ghost">次へ</button>
    </div>
  </main>
  <div class="toast" id="toast" hidden></div>
  <script src="../../../../../../assets/app.js"></script>
  <script src="app.js"></script>
</body>
</html>
