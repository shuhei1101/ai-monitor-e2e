<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク編集 - 案 A: 単一フォーム</title>
  <link rel="stylesheet" href="../../../../../../assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">my-plugins mock</div>
  </header>
  <main class="main">
    <p class="breadcrumb"><a href="../">案リスト</a> &gt; <span>案 A</span></p>
    <div class="page-header">
      <h1>タスク編集</h1>
      <div class="actions">
        <button class="ghost" id="task-cancel-btn">キャンセル</button>
        <button class="primary" id="task-save-btn">保存</button>
      </div>
    </div>
    <p class="hint">一覧で選んだタスクを 1 枚のフォームで編集する。保存・キャンセルはいずれも一覧へ戻る。</p>

    <section class="card">
      <div class="field-row"><span class="field-label">タスク ID</span><span class="field-value"><span id="task-id">T-101</span></span></div>
      <div class="field-row"><span class="field-label">タイトル</span><span class="field-value"><input type="text" id="task-title" value="請求書テンプレートの差し替え"></span></div>
      <div class="field-row"><span class="field-label">詳細</span><span class="field-value"><textarea id="task-description" rows="4">新様式の請求書テンプレートに差し替える。経理チームの確認を取ってから反映する。</textarea></span></div>
      <div class="field-row"><span class="field-label">状態</span><span class="field-value">
        <select id="task-status">
          <option>未着手</option>
          <option selected>対応中</option>
          <option>完了</option>
        </select>
      </span></div>
      <div class="field-row"><span class="field-label">期限</span><span class="field-value"><input type="date" id="task-due-date" value="2026-08-14"></span></div>
      <div class="field-row"><span class="field-label">担当</span><span class="field-value">
        <select id="task-assignee">
          <option selected>山田 太郎</option>
          <option>佐藤 花子</option>
          <option>鈴木 一郎</option>
        </select>
      </span></div>
    </section>
  </main>
  <div class="toast" id="toast" hidden></div>
  <script src="../../../../../../assets/app.js"></script>
  <script src="app.js"></script>
</body>
</html>
